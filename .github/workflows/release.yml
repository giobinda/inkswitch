# Builds the AppImage and the Flatpak bundle and attaches them to a GitHub release
# whenever a version tag (v1.2.3) is pushed.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak libxkbcommon0 xkb-data
          # Lets the binary be linked against an old glibc, see packaging/build-binary.sh.
          pipx install ziglang
          pipx install cargo-zigbuild
          # pipx names the compiler python-zig; cargo-zigbuild looks for zig.
          # The link goes next to it, wherever pipx puts its programs on this runner.
          ln -s python-zig "$(dirname "$(command -v python-zig)")/zig"
          zig version
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.freedesktop.Platform//25.08

      - name: Test
        run: cargo test --release

      - name: Build the AppImage
        run: packaging/build-appimage.sh

      - name: Build the Flatpak
        run: |
          # On failure, repeat the end of the output as an error annotation, which can be read
          # from the run's summary without opening the full log.
          if ! sh -x packaging/build-flatpak.sh > flatpak.log 2>&1; then
            cat flatpak.log
            echo "::error title=Flatpak build::$(tail -n 25 flatpak.log | sed -e 's/%/%25/g' | sed -e ':a' -e 'N' -e '$!ba' -e 's/\n/%0A/g')"
            exit 1
          fi
          tail -n 3 flatpak.log

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Inkswitch-x86_64.AppImage
            dist/Inkswitch.flatpak
          generate_release_notes: true
